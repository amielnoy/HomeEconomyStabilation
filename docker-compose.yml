services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: home-economy-api:local
    environment:
      PORT: "3000"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:-}"
      MONITOR_WEB_ORIGIN: "http://web"
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: home-economy-web:local
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: home-economy-tests:local
    shm_size: "1gb"
    depends_on:
      web:
        condition: service_healthy
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://web"
      ALLURE_RESULTS_DIR: "/workspace/allure-results"
    volumes:
      - allure-results:/workspace/allure-results
      - allure-report:/workspace/allure-report

  allure:
    image: nginx:1.29-alpine
    volumes:
      - allure-report:/usr/share/nginx/html:ro
    expose:
      - "80"
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 20
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]

  prometheus:
    image: prom/prometheus:v3.12.0
    depends_on:
      web:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:13.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"

volumes:
  prometheus-data:
  grafana-data:
  allure-results:
  allure-report:
