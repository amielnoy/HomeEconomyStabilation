name: Gate

# The blocking tier: everything except the extra browser projects. Vitest, Pytest
# and the Playwright desktop-chromium and api projects catch essentially every
# real defect, while webkit and the Android profiles — which roughly tripled the
# Playwright time — move to the nightly Sanity run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build TypeScript
        run: npm run build

      # Only the browser the gate projects actually drive.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The allure-instrumented script variants and ALLURE_RESULTS_DIR make all three
      # runners (vitest, pytest, and Playwright's conditional allure-playwright reporter)
      # write into the same results directory; test:gate itself is unchanged.
      - name: Run Vitest, Pytest and Playwright in parallel
        env:
          ALLURE_RESULTS_DIR: allure-results
          VITEST_SCRIPT: test:allure
          SERVER_TEST_SCRIPT: test:server:allure
        run: npm run test:gate

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # A failed run still leaves partial allure-results from whatever finished before
      # the failure, which is exactly what is useful for debugging it — generated and
      # uploaded the same way whether the run passed or failed, never on a cancelled one.
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --output allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy-production:
    name: Deploy latest version to Vercel
    needs: gate
    if: >-
      ${{
        needs.gate.result == 'success' &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://home-economy-stabilation.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tested revision
        run: npm run build

      # Fail with a readable message rather than letting the CLI report an empty
      # --token, which is what an unset secret used to look like.
      - name: Check Vercel credentials are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The CLI prints progress on stderr and the deployment URL as its last line of
      # stdout. Keeping it lets the summary name the exact deployment this run made,
      # not just the alias it will answer on.
      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          deployment="$(npx --yes vercel@59.5.0 deploy . --prod --yes | tail -n 1)"
          echo "url=$deployment" >> "$GITHUB_OUTPUT"

      # Where the run ends, say where it landed. A green tick tells nobody which site
      # to open; the run summary is the one place everyone already looks.
      - name: Say where it landed
        if: ${{ !cancelled() }}
        env:
          SITE_URL: https://home-economy-stabilation.vercel.app
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "## Deployed"
              echo
              echo "| | |"
              echo "| --- | --- |"
              echo "| Site | $SITE_URL |"
              echo "| This deployment | $DEPLOYMENT_URL |"
              echo "| Guide | $SITE_URL/guide.html |"
              echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            else
              echo "## Not deployed"
              echo
              echo "The deploy step produced no URL, so $SITE_URL still serves the previous revision."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
