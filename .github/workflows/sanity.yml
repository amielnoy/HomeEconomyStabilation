name: Sanity

# The full tier: every test on every browser project — desktop Chromium, iOS
# WebKit, Android Chrome portrait and landscape, and the API project.
#
# 02:00 UTC is 05:00 in Israel during daylight saving. GitHub's cron is UTC only
# and never adjusts for DST, so this lands at 04:00 local through the winter.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A nightly run is not superseded by a later one, so it is left to finish rather
# than being cancelled in progress.
concurrency:
  group: sanity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanity:
    name: Build and test every browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build TypeScript
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Vitest, Pytest and Playwright in parallel
        run: npm run test:all

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
